<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISA - Registro de Ingreso</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <!-- (SEGURIDAD...) -->
    <script src="seguridad.js"></script>
    <!-- LIBRERÍA SHEETJS PARA LEER EXCEL EN EL NAVEGADOR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* ==========================================
           SISTEMA DE DISEÑO POLARIS (SHOPIFY EXACTO)
           ========================================== */
        :root {
            --p-surface: #ffffff;
            --p-background: #f4f6f8;
            --p-text: #202223;
            --p-text-subdued: #6d7175;
            --p-border: #c9cccf;
            --p-border-subdued: #1e293b;
            --p-action-primary: #1e293b;
            --p-action-primary-hover: #0f172a;
            --p-action-primary-pressed: #020617;
            --p-interactive: #2c6ecb;
            --p-critical: #d82c0d;
            --p-warning: #b98900;
            --p-success: #108043;
            --p-shadow-card: 0 0 0 1px rgba(63, 63, 68, 0.05), 0 1px 3px 0 rgba(63, 63, 68, 0.15);
            --p-shadow-bar: 0 -1px 3px 0 rgba(63, 63, 68, 0.05), 0 -1px 2px 0 rgba(63, 63, 68, 0.15);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: var(--p-background); 
            color: var(--p-text); 
            padding-bottom: 90px; 
        }

        /* ==========================================
           HEADER (CABECERA) - CENTRADA Y OSCURA
           ========================================== */
        .polaris-header {
            background-color: #1e293b;
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            position: sticky; 
            top: 0; 
            z-index: 100;
            border-bottom: 1px solid var(--p-border-subdued);
        }
        
        .polaris-header h1 { 
            font-size: 18px; font-weight: 600; color: #ffffff; line-height: 1.2; text-align: center; text-transform: uppercase; 
        }

        .icon-btn {
            color: white; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
            padding: 4px; border-radius: 4px;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); }
        .icon-btn:active { background: rgba(255,255,255,0.2); }

        /* ==========================================
           CONTENEDOR Y TARJETAS (CARDS)
           ========================================== */
        .form-layout { 
            padding: 16px; max-width: 650px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
        }

        .polaris-card {
            background: var(--p-surface); border-radius: 8px; box-shadow: var(--p-shadow-card); overflow: hidden;
        }
        
        .polaris-card-header {
            padding: 16px 16px 12px 16px; font-size: 15px; font-weight: 600; color: var(--p-text);
        }

        .polaris-card-body {
            padding: 0 16px 16px 16px; display: flex; flex-direction: column; gap: 12px;
        }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .full-width { grid-column: 1 / -1; }

        /* ==========================================
           INPUTS ESTILO SHOPIFY POLARIS
           ========================================== */
        .polaris-field { display: flex; flex-direction: column; gap: 4px; }
        .polaris-label { font-size: 13px; font-weight: 500; color: var(--p-text); line-height: 1.2;}
        
        .polaris-input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
        
        .polaris-input {
            width: 100%; padding: 6px 10px; border: 1px solid var(--p-border); border-radius: 4px; font-size: 14px;
            color: var(--p-text); background-color: var(--p-surface); transition: border-color 0.2s, box-shadow 0.2s; height: 34px; 
        }
        
        .polaris-input:focus { outline: none; border-color: var(--p-action-primary); box-shadow: 0 0 0 1px var(--p-action-primary); }
        .polaris-input:disabled, .polaris-input[readonly] { background-color: #fafbfb; color: var(--p-text-subdued); border-color: var(--p-border-subdued); cursor: not-allowed; }

        #in-nombre, #in-codigo, #in-documento { text-transform: uppercase; }

        .prefix { position: absolute; left: 10px; color: var(--p-text-subdued); font-size: 13px; }
        .has-prefix { padding-left: 28px !important; } 
        
        .action-icon {
            position: absolute; right: 2px; background: none; border: none; color: var(--p-text-subdued);
            cursor: pointer; padding: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
        }
        .action-icon:active { background: #f0f2f4; color: var(--p-text); }

        /* ==========================================
           BARRA DE ACCIÓN INFERIOR (BOTTOM BAR)
           ========================================== */
        .polaris-bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--p-surface); padding: 12px 20px;
            box-shadow: var(--p-shadow-bar); display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        
        .price-summary { display: flex; flex-direction: column; }
        .price-summary span { font-size: 11px; color: var(--p-text-subdued); text-transform: uppercase; letter-spacing: 0.5px;}
        .price-summary strong { font-size: 16px; font-weight: 600; color: var(--p-action-primary); }

        .polaris-btn-primary {
            background-color: var(--p-action-primary); color: white; border: 1px solid transparent; padding: 8px 16px;
            border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,0.05);
            transition: background 0.2s; height: 38px;
        }
        .polaris-btn-primary:hover { background-color: var(--p-action-primary-hover); }
        .polaris-btn-primary:active { background-color: var(--p-action-primary-pressed); box-shadow: inset 0 1px 1px rgba(0,0,0,0.1); }

        /* ==========================================
           CONTENEDOR DE BOTONES FLOTANTES (CÍRCULOS)
           ========================================== */
        .fab-container { position: fixed; bottom: 85px; right: 16px; display: flex; flex-direction: column; gap: 12px; z-index: 90; }
        .fab-button {
            color: white; border: none; border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center;
            justify-content: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); cursor: pointer; transition: transform 0.2s, background 0.2s;
        }
        .fab-button:active { transform: scale(0.95); }
        .fab-template { background-color: var(--p-interactive); } .fab-template:hover { background-color: #1f5199; }
        .fab-import { background-color: #108043; margin: 0; } .fab-import:hover { background-color: #0b5c30; }

        /* ==========================================
           SISTEMA DE MODALES Y ALERTAS PRO
           ========================================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(32, 34, 35, 0.8);
            display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; animation: fadeIn 0.2s forwards;
        }
        .modal-content {
            background: var(--p-surface); width: 90%; max-width: 400px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden; transform: scale(0.95); animation: scaleUp 0.2s forwards;
        }
        .modal-header { padding: 16px 20px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--p-border); }
        .modal-body { padding: 20px; color: var(--p-text); font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
        .modal-footer { padding: 16px 20px; background: #fafbfb; border-top: 1px solid var(--p-border); display: flex; justify-content: flex-end; gap: 10px;}
        
        .modal-header.error { color: var(--p-critical); }
        .modal-header.warning { color: var(--p-warning); }
        .modal-header.success { color: var(--p-success); }
        
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes scaleUp { to { transform: scale(1); } }

        /* Toast Notification */
        .polaris-toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #202223; color: white; 
            padding: 12px 16px; border-radius: 4px; font-size: 14px; display: none; z-index: 1000; align-items: center; gap: 8px;
        }
    </style>



</head>
<body>

    <header class="polaris-header">
        <div style="display: flex; justify-content: flex-start;"></div>
        <h1>REGISTRAR PRODUCTOS</h1>
        <div style="display: flex; justify-content: flex-end;">
            <!-- Redirigir al Panel de Control (Inventario) si el usuario lo desea manualmente -->
            <span class="material-icons-outlined icon-btn" onclick="window.location.href='Control.html'" title="Volver al Panel" style="font-size: 24px;">add_shopping_cart</span>
        </div>
    </header>

    <div class="form-layout">
        <form id="form-ingreso" onsubmit="event.preventDefault(); guardarIngreso();">
            
            <!-- TARJETA 1: DATOS DEL DOCUMENTO -->
            <div class="polaris-card">
                <div class="polaris-card-header">DETALLES DEL DOCUMENTO</div>
                <div class="polaris-card-body form-grid">
                    <div class="polaris-field">
                        <label class="polaris-label">Nº Factura / Boleta</label>
                        <input type="text" id="in-documento" class="polaris-input" placeholder="F-000-00003" required>
                    </div>
                    <div class="polaris-field">
                        <label class="polaris-label">Fecha de ingreso</label>
                        <input type="date" id="in-fecha" class="polaris-input" required readonly title="La fecha se asigna automáticamente al día de hoy">
                    </div>
                    
                    <div class="polaris-field">
                        <label class="polaris-label">Almacén de destino</label>
                        <select id="in-almacen" class="polaris-input" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <option value="A1C1">A1C1</option>
                            <option value="A1C2">A1C2</option>
                            <option value="A1C3">A1C3</option>
                            <option value="A2C1">A2C1</option>
                            <option value="A2C2">A2C2</option>
                            <option value="A2C3">A2C3</option>
                            <option value="A3C1">A3C1</option>
                            <option value="A3C2">A3C2</option>
                            <option value="A3C3">A3C3</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- TARJETA 2: PRODUCTO -->
            <div class="polaris-card">
                <div class="polaris-card-header">DETALLES DEL PRODUCTO</div>
                <div class="polaris-card-body form-grid">
                    <div class="polaris-field full-width">
                        <label class="polaris-label">Código del producto (SKU)</label>
                        <div class="polaris-input-wrapper">
                            <input type="text" id="in-codigo" class="polaris-input" placeholder="Escanea o escribe el código" required>
                            <button type="button" class="action-icon" onclick="mostrarToast('Iniciando cámara para escaneo...')">
                                <span class="material-icons-outlined" style="font-size: 20px;">qr_code_scanner</span>
                            </button>
                        </div>
                    </div>
                    <div class="polaris-field full-width">
                        <label class="polaris-label">Nombre del producto</label>
                        <input type="text" id="in-nombre" class="polaris-input" placeholder="Ej. Candado inteligente" required>
                    </div>
                    
                    <div class="polaris-field">
                        <label class="polaris-label">Categoría</label>
                        <select id="in-categoria" class="polaris-input" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <option value="Celulares">Celulares</option>
                            <option value="Tecnología">Tecnología</option>
                            <option value="Repuesto">Repuesto</option>
                            <option value="Electrónica">Electrónica</option>
                            <option value="Electrodomésticos">Electrodomésticos</option>
                            <option value="Juguetes">Juguetes</option>
                            <option value="Alimentos">Alimentos</option>
                            <option value="Mascotas">Mascotas</option>
                            <option value="Joyería">Joyería</option>
                            <option value="Ropa">Ropa</option>
                            <option value="Llaveros">Llaveros</option>
                            <option value="Cosméticos">Cosméticos</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- TARJETA 3: COSTOS E INVENTARIO -->
            <div class="polaris-card">
                <div class="polaris-card-header">Cálculo de Precios</div>
                <div class="polaris-card-body form-grid">
                    <div class="polaris-field">
                        <label class="polaris-label">Cant. a Ingresar</label>
                        <input type="number" id="in-cantidad" class="polaris-input" placeholder="Ej. 10" min="0.1" step="0.1" required oninput="calcularPrecioVenta()">
                    </div>

                    <div class="polaris-field">
                        <label class="polaris-label">Unidad Medida</label>
                        <select id="in-unidad" class="polaris-input" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <option value="UND">Und.</option>
                            <option value="PAR">Par.</option>
                            <option value="PAQU">Paqu.</option>
                            <option value="KG">Kg.</option>
                            <option value="TN">Tn.</option>
                            <option value="LT">Lt.</option>
                            <option value="ML">ml.</option>
                        </select>
                    </div>
                    
                    <div class="polaris-field">
                        <label class="polaris-label">Costo Lote (S/.)</label>
                        <div class="polaris-input-wrapper">
                            <span class="prefix">S/.</span>
                            <input type="number" id="in-costo-total" class="polaris-input has-prefix" placeholder="0.00" min="0.01" step="0.01" required oninput="calcularPrecioVenta()">
                        </div>
                    </div>
                    
                    <div class="polaris-field">
                        <label class="polaris-label">Precio Sugerido</label>
                        <div class="polaris-input-wrapper">
                            <span class="prefix">S/.</span>
                            <input type="text" id="in-precio-calculado" class="polaris-input has-prefix" value="0.00" readonly style="font-weight: 600; color: var(--p-action-primary); background-color: #f0fdf4; border-color: #bbf7d0;">
                        </div>
                        <span style="font-size: 10px; color: var(--p-text-subdued); margin-top: 2px;">
                            (Costo / Cant) × 2.5 + IGV
                        </span>
                    </div>
                </div>
            </div>

        </form>
    </div>

    <!-- BOTONES FLOTANTES: SOLO ÍCONOS -->
    <div class="fab-container">
        <button type="button" class="fab-button fab-template" onclick="descargarPlantilla()" title="Descargar Plantilla Base">
            <span class="material-icons-outlined" style="font-size: 22px;">file_download</span>
        </button>

        <label for="import-excel" class="fab-button fab-import" title="Importar Archivo Excel">
            <span class="material-icons-outlined" style="font-size: 22px;">file_upload</span>
        </label>
        <input type="file" id="import-excel" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" style="display: none;">
    </div>

    <!-- BARRA INFERIOR (GUARDAR) -->
    <div class="polaris-bottom-bar">
        <div class="price-summary">
            <span>Precio del Producto</span>
            <strong id="bar-precio">S/. 0.00</strong>
        </div>
        <button type="submit" form="form-ingreso" class="polaris-btn-primary">GUARDAR LOTE</button>
    </div>

    <!-- ==========================================
         MODALES DE SISTEMA Y TOASTS
         ========================================== -->
    
    <!-- Modal de Alertas -->
    <div id="modal-alerta" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header" id="alerta-header">
                <span class="material-icons-outlined" id="alerta-icon">error</span>
                <h3 id="alerta-titulo">Atención</h3>
            </div>
            <div class="modal-body" id="alerta-mensaje">Mensaje de error aquí.</div>
            <div class="modal-footer">
                <button class="polaris-btn-primary" onclick="cerrarAlerta()">Entendido</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="polaris-toast">
        <span class="material-icons-outlined" style="font-size: 18px;" id="toast-icon">check_circle</span>
        <span id="toast-msg">Mensaje temporal</span>
    </div>

<script>
    // ==========================================
    // SISTEMA VISUAL DE ALERTAS PRO Y TOASTS
    // ==========================================
    let alertaCallback = null;

    function mostrarAlerta(titulo, mensaje, tipo = 'error', callback = null) {
        const modal = document.getElementById('modal-alerta');
        const header = document.getElementById('alerta-header');
        const icon = document.getElementById('alerta-icon');
        
        document.getElementById('alerta-titulo').innerText = titulo;
        document.getElementById('alerta-mensaje').innerText = mensaje;

        header.className = 'modal-header'; 
        if(tipo === 'error') {
            header.classList.add('error'); icon.innerText = 'error';
        } else if (tipo === 'warning') {
            header.classList.add('warning'); icon.innerText = 'warning';
        } else if (tipo === 'success') {
            header.classList.add('success'); icon.innerText = 'check_circle';
        }

        alertaCallback = callback; // Guardamos qué hacer después de dar "Entendido"
        modal.style.display = 'flex';
    }

    function cerrarAlerta() {
        document.getElementById('modal-alerta').style.display = 'none';
        if (alertaCallback) {
            alertaCallback();
            alertaCallback = null;
        }
    }

    function mostrarToast(mensaje) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = mensaje;
        toast.style.display = 'flex';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    // ==========================================
    // 1. INICIALIZACIÓN, FECHA AUTOMÁTICA Y SEGURIDAD
    // ==========================================
    window.onload = () => {
        // --- INICIO DEL GUARDIÁN ---
        const sesionStr = localStorage.getItem('isa_sesion');
        
        if (!sesionStr) {
            window.location.href = 'index.html'; // Expulsar si no hay sesión
            return;
        }

        const sesion = JSON.parse(sesionStr);
        
        // Control RBAC: Vendedores NO deben registrar ingresos (solo Logística, Gerentes o Admins)
        if (sesion.rol === 'Vendedor') {
            alert('Acceso Denegado: Su rol de Vendedor no tiene permisos para ingresar nueva mercadería al sistema.');
            window.location.href = 'RegistroSalidas.html'; // Lo devolvemos a su caja
            return;
        }
        // --- FIN DEL GUARDIÁN ---

        // Si pasa la seguridad, cargamos la fecha de hoy
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('in-fecha').value = hoy;
    };

    // ==========================================
    // 2. LÓGICA MATEMÁTICA PARA FIJACIÓN DE PRECIOS
    // ==========================================
    function calcularPrecioVenta() {
        const cantidad = parseFloat(document.getElementById('in-cantidad').value) || 0;
        const costoTotal = parseFloat(document.getElementById('in-costo-total').value) || 0;
        
        let precioVentaSugerido = 0;

        if (cantidad > 0 && costoTotal > 0) {
            const costoUnitario = costoTotal / cantidad;
            const precioBase = costoUnitario * 2.5;
            precioVentaSugerido = precioBase * 1.18;
        }
        
        const precioFormateado = precioVentaSugerido.toFixed(2);
        
        document.getElementById('in-precio-calculado').value = precioFormateado;
        document.getElementById('bar-precio').innerText = `S/. ${precioFormateado}`;
    }

    // ==========================================
    // 3. GUARDAR MANUALMENTE UN SOLO INGRESO
    // ==========================================
    function guardarIngreso() {
        const numDoc = document.getElementById('in-documento').value.trim().toUpperCase();
        const codProd = document.getElementById('in-codigo').value.trim().toUpperCase();
        const nombreProd = document.getElementById('in-nombre').value.trim().toUpperCase();
        const categoria = document.getElementById('in-categoria').value;
        const almacen = document.getElementById('in-almacen').value;
        const unidad = document.getElementById('in-unidad').value;
        const cantidad = parseFloat(document.getElementById('in-cantidad').value);
        const costoTotal = parseFloat(document.getElementById('in-costo-total').value);

        if (!almacen) return mostrarAlerta("Campos Incompletos", "Debe seleccionar un Almacén de destino.", "warning");
        if (!unidad) return mostrarAlerta("Campos Incompletos", "Debe seleccionar una Unidad de medida.", "warning");
        if (!numDoc || !codProd || !nombreProd || !categoria) return mostrarAlerta("Campos Incompletos", "Por favor, complete todos los campos de texto.", "warning");
        if (isNaN(cantidad) || cantidad <= 0) return mostrarAlerta("Cantidad Inválida", "La cantidad ingresada debe ser mayor a 0.", "error");
        if (isNaN(costoTotal) || costoTotal <= 0) return mostrarAlerta("Costo Inválido", "El costo total del lote debe ser mayor a 0.", "error");

        let bdActual = JSON.parse(localStorage.getItem('isa_ingresos_db')) || [];
        
        // Bloquear códigos repetidos
        const existeCodigoBD = bdActual.some(item => item.cod.toUpperCase() === codProd && !item.anulado);
        if (existeCodigoBD) {
            return mostrarAlerta("Código Duplicado", `El código "${codProd}" ya está registrado en el sistema.\nLos códigos de producto deben ser únicos.`, "error");
        }

        const nuevoIngreso = {
            id: Date.now().toString() + Math.floor(Math.random() * 1000),
            doc: numDoc,
            fecha: document.getElementById('in-fecha').value,
            almacen: almacen,
            cod: codProd,
            nombre: nombreProd,
            categoria: categoria,
            cant: cantidad,
            unidad: unidad,
            costoTotalUSD: costoTotal,
            precioUnitarioPEN: parseFloat(document.getElementById('in-precio-calculado').value),
            anulado: false
        };
        
        bdActual.unshift(nuevoIngreso);
        localStorage.setItem('isa_ingresos_db', JSON.stringify(bdActual));

        mostrarToast(`Lote de ${nombreProd} guardado correctamente.`);
        
        setTimeout(() => { 
            // REDIRECCIÓN CAMBIADA: Recarga la misma página para un flujo de trabajo continuo
            window.location.href = 'RegistroIngresos.html';
        }, 1500);
    }

    // ==========================================
    // 4. DESCARGAR LA PLANTILLA OFICIAL EXACTA

        const byteCharacters = atob(plantillaBase64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        
        const blob = new Blob([byteArray], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "PLANTILLA_DE_INVETARIO_ISA.xlsx";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // ==========================================
    // 5. CEREBRO DE IMPORTACIÓN MASIVA ESTRICTO
    // ==========================================
    document.getElementById('import-excel').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        e.target.value = null; // Reset input

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0]; 
                const worksheet = workbook.Sheets[firstSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet);

                if(json.length === 0) {
                    return mostrarAlerta("Archivo Vacío", "El archivo Excel está vacío o no tiene el formato correcto.", "warning");
                }

                const almacenesValidos = ["A1C1", "A1C2", "A1C3", "A2C1", "A2C2", "A2C3", "A3C1", "A3C2", "A3C3"];
                
                const categoriasValidas = [
                    "CELULARES", "TECNOLOGÍA", "TECNOLOGIA", "REPUESTO", "ELECTRÓNICA", "ELECTRONICA", 
                    "ELECTRODOMÉSTICOS", "ELECTRODOMESTICOS", "JUGUETES", "ALIMENTOS", "MASCOTAS", 
                    "JOYERÍA", "JOYERIA", "ROPA", "LLAVEROS", "COSMÉTICOS", "COSMETICOS", "OTROS"
                ];
                
                const unidadesValidas = ["UND", "PAR", "PAQU", "KG", "TN", "LT", "ML"];
                const unidadesEnteras = ["UND", "PAR", "PAQU"];

                let bdActual = JSON.parse(localStorage.getItem('isa_ingresos_db')) || [];
                let productosValidados = [];
                let codigosEnExcel = []; 

                for (let i = 0; i < json.length; i++) {
                    const row = json[i];
                    const filaExcel = i + 2; 

                    const numDoc = (row['Nº de documento'] || row['Documento'] || "").toString().trim().toUpperCase();
                    if(!numDoc || numDoc === "NAN" || numDoc === "UNDEFINED") {
                        return mostrarAlerta("Importación Cancelada", `ERROR EN FILA ${filaExcel}:\nEl 'Nº de documento' es obligatorio y no puede estar vacío.`, "error");
                    }

                    const codProd = (row['Codigo'] || row['Código'] || "").toString().trim().toUpperCase();
                    const nombreProd = (row['Nombre del Producto'] || row['Nombre'] || "").toString().trim().toUpperCase();
                    
                    if(!codProd || !nombreProd) {
                        return mostrarAlerta("Importación Cancelada", `ERROR EN FILA ${filaExcel}:\nEl 'Código' y el 'Nombre del Producto' son obligatorios.`, "error");
                    }

                    if (codigosEnExcel.includes(codProd)) {
                        return mostrarAlerta("Importación Cancelada", `ERROR EN FILA ${filaExcel}:\nEl código "${codProd}" está repetido dentro del archivo Excel.\nAsegúrese de que no haya códigos duplicados en su lista.`, "error");
                    }
                    codigosEnExcel.push(codProd);

                    const existeEnBD = bdActual.some(item => item.cod.toUpperCase() === codProd && !item.anulado);
                    if (existeEnBD) {
                        return mostrarAlerta("Importación Cancelada", `ERROR EN FILA ${filaExcel}:\nEl código "${codProd}" ya se encuentra registrado en el sistema de inventario.\nIngrese un código diferente para los nuevos productos.`, "error");
                    }

                    const almacen = (row['Almacen'] || row['Almacén'] || "").toString().trim().toUpperCase();
                    if (!almacenesValidos.includes(almacen)) {
                        return mostrarAlerta("Importación Cancelada", `ERROR EN FILA ${filaExcel}:\nEl almacén "${almacen}" no existe. Revisa la hoja 'Valores_Permitidos' en tu Excel.`, "error");
                    }

                    const categoria = (row['Categoria'] || row['Categoría'] || "").toString().trim().toUpperCase();
                    if (!categoriasValidas.includes(categoria)) {
                        return mostrarAlerta("Importación Cancelada", `ERROR EN FILA ${filaExcel}:\nLa categoría "${categoria}" no es válida. Revisa la hoja 'Valores_Permitidos' en tu Excel.`, "error");
                    }

                    const unidadCruda = (row['Unidad'] || "").toString().trim().toUpperCase().replace(/\./g, '');
                    if (!unidadesValidas.includes(unidadCruda)) {
                        return mostrarAlerta("Importación Cancelada", `ERROR EN FILA ${filaExcel}:\nLa unidad "${row['Unidad']}" no es válida. Revisa la hoja 'Valores_Permitidos' en tu Excel.`, "error");
                    }

                    const cantidad = parseFloat(row['Cantidad']);
                    if (isNaN(cantidad) || cantidad <= 0) {
                        return mostrarAlerta("Importación Cancelada", `ERROR EN FILA ${filaExcel}:\nLa cantidad ingresada debe ser mayor a 0.`, "error");
                    }

                    if (unidadesEnteras.includes(unidadCruda) && !Number.isInteger(cantidad)) {
                        return mostrarAlerta("Importación Cancelada", `ERROR EN FILA ${filaExcel}:\nHa intentado ingresar cantidad con decimales (${cantidad}) para la unidad "${unidadCruda}".\nPor favor, use solo números enteros.`, "error");
                    }
                    
                    let costoCrudo = row['Costo Total'] || row['Precio Total'] || 0;
                    if(typeof costoCrudo === 'string') costoCrudo = costoCrudo.replace(/[^0-9.-]+/g,"");
                    const costoTotal = parseFloat(costoCrudo);
                    if (isNaN(costoTotal) || costoTotal <= 0) {
                        return mostrarAlerta("Importación Cancelada", `ERROR EN FILA ${filaExcel}:\nEl 'Costo Total' debe ser mayor a 0.`, "error");
                    }

                    const fechaAutomatica = new Date().toISOString().split('T')[0];
                    const costoUnitario = costoTotal / cantidad;
                    const precioBase = costoUnitario * 2.5;
                    const precioSug = parseFloat((precioBase * 1.18).toFixed(2));

                    let catFormateada = "General";
                    if(categoria === "CELULARES") catFormateada = "Celulares";
                    if(categoria === "TECNOLOGÍA" || categoria === "TECNOLOGIA") catFormateada = "Tecnología";
                    if(categoria === "REPUESTO") catFormateada = "Repuesto";
                    if(categoria === "ELECTRÓNICA" || categoria === "ELECTRONICA") catFormateada = "Electrónica";
                    if(categoria === "ELECTRODOMÉSTICOS" || categoria === "ELECTRODOMESTICOS") catFormateada = "Electrodomésticos";
                    if(categoria === "JUGUETES") catFormateada = "Juguetes";
                    if(categoria === "ALIMENTOS") catFormateada = "Alimentos";
                    if(categoria === "MASCOTAS") catFormateada = "Mascotas";
                    if(categoria === "JOYERÍA" || categoria === "JOYERIA") catFormateada = "Joyería";
                    if(categoria === "ROPA") catFormateada = "Ropa";
                    if(categoria === "LLAVEROS") catFormateada = "Llaveros";
                    if(categoria === "COSMÉTICOS" || categoria === "COSMETICOS") catFormateada = "Cosméticos";
                    if(categoria === "OTROS") catFormateada = "Otros";

                    const nuevoIngresoMasivo = {
                        id: Date.now().toString() + Math.floor(Math.random() * 1000) + i,
                        doc: numDoc,
                        fecha: fechaAutomatica,
                        almacen: almacen,
                        cod: codProd,
                        nombre: nombreProd,
                        categoria: catFormateada,
                        cant: cantidad,
                        unidad: unidadCruda, 
                        costoTotalUSD: costoTotal,
                        precioUnitarioPEN: precioSug,
                        anulado: false
                    };

                    productosValidados.push(nuevoIngresoMasivo);
                }

                if (productosValidados.length > 0) {
                    bdActual = [...productosValidados.reverse(), ...bdActual]; 
                    localStorage.setItem('isa_ingresos_db', JSON.stringify(bdActual));
                    
                    // Alerta de éxito con redirección a la misma página
                    mostrarAlerta(
                        "¡Importación Exitosa!", 
                        `Se validaron y subieron ${productosValidados.length} productos a la base de datos con Fecha y Precio automático.`, 
                        "success", 
                        () => { window.location.href = 'RegistroIngresos.html'; }
                    );
                }

            } catch(error) {
                console.error(error);
                mostrarAlerta("Error Crítico", "Hubo un error al procesar el archivo Excel. Asegúrate de estar usando la plantilla oficial.", "error");
            }
        };
        
        reader.readAsArrayBuffer(file);
    });
</script>
