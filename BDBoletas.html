<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISA - Historial de Ventas</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
   <script src="seguridad.js"></script>
   
   <style>
        /* ==========================================
           SISTEMA DE DISEÑO POLARIS (MEJORADO)
           ========================================== */
        :root {
            --p-surface: #ffffff;
            --p-background: #f4f6f8;
            --p-text: #202223;
            --p-text-subdued: #6d7175;
            --p-border: #c9cccf;
            --p-border-subdued: #1e293b;
            --p-action-primary: #1e293b;
            --p-interactive: #2c6ecb;
            --p-interactive-light: #f0f4f8;
            --p-shadow-card: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            
            --success-bg: #e0f2f1;
            --success-text: #00695c;
            --danger: #d82c0d;
            --danger-bg: #fef2f2;
            --ticket-bg: #fafbfb;
            --warning: #b98900;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent;}
        
        /* FIJACIÓN DE PANTALLA TIPO APP NATIVA */
        body { 
            background-color: var(--p-background); 
            color: var(--p-text); 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* ==========================================
           SECCIÓN SUPERIOR FIJA (ESTÁTICA)
           ========================================== */
        .top-fixed-section {
            flex-shrink: 0; 
            background: var(--p-background);
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            padding-bottom: 10px;
        }

        /* HEADER */
        .polaris-header {
            background-color: #1e293b; padding: 12px 20px; display: grid; grid-template-columns: 1fr auto 1fr;
            align-items: center; 
        }
        .polaris-header h1 { font-size: 16px; font-weight: 600; color: #ffffff; line-height: 1.2; text-align: center; letter-spacing: 0.5px;}
        .icon-btn { color: white; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 6px;}
        .icon-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }

        .system-info { display: flex; justify-content: space-between; align-items: center; background: var(--p-surface); padding: 8px 20px; font-size: 12px; color: var(--p-text-subdued); border-bottom: 1px solid var(--p-border);}

        /* KPI Y BUSCADOR COMPACTOS */
        .dashboard-container { padding: 15px 20px 0; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        
        .kpi-card {
            background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 8px; padding: 12px 16px; 
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: white;
        }
        .kpi-card h3 { font-size: 12px; color: #cbd5e1; font-weight: 600; text-transform: uppercase; margin: 0;}
        .kpi-card .value { font-size: 20px; font-weight: 700; color: #4ade80; margin: 0;}

        .search-box { background: var(--p-surface); padding: 12px; border-radius: 8px; box-shadow: var(--p-shadow-card); border: 1px solid rgba(0,0,0,0.05);}
        .search-header { font-size: 13px; font-weight: 600; color: var(--p-action-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .search-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .full-width { grid-column: 1 / -1; }
        
        .polaris-field { display: flex; flex-direction: column; gap: 2px; }
        .polaris-label { font-size: 10px; font-weight: 600; color: var(--p-text-subdued); text-transform: uppercase;}
        .polaris-input { width: 100%; padding: 6px 10px; border: 1px solid var(--p-border); border-radius: 4px; font-size: 12px; color: var(--p-text); background-color: var(--p-surface); height: 32px;}
        .polaris-input:focus { outline: none; border-color: var(--p-interactive); box-shadow: 0 0 0 2px rgba(44, 110, 203, 0.2); }

        .btn-limpiar { background: #f1f5f9; color: #475569; border: none; padding: 6px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; width: 100%;}
        .btn-limpiar:hover { background: #e2e8f0; }

        /* ==========================================
           ZONA DESLIZABLE (SCROLL EXCLUSIVO)
           ========================================== */
        .scrollable-list {
            flex-grow: 1; 
            overflow-y: auto; 
            padding-top: 10px;
            padding-bottom: 30px; 
        }
        .scrollable-list::-webkit-scrollbar { width: 0px; background: transparent; }

        .sales-list { display: flex; flex-direction: column; gap: 16px; padding: 0 20px; max-width: 800px; margin: 0 auto;}
        
        .sale-card { background: var(--p-surface); border-radius: 8px; overflow: hidden; box-shadow: var(--p-shadow-card); border: 1px solid var(--p-border); transition: all 0.3s;}
        .sale-card.anulada { background: var(--danger-bg); border-color: #fca5a5; opacity: 0.85; }
        
        .card-header { background: var(--ticket-bg); padding: 12px 16px; border-bottom: 2px dashed var(--p-border); display: flex; justify-content: space-between; align-items: center;}
        .sale-card.anulada .card-header { background: #fee2e2; border-bottom-color: #fca5a5; }

        .ticket-id { font-weight: 800; color: var(--p-action-primary); font-size: 14px; display: flex; align-items: center; gap: 6px;}
        .sale-card.anulada .ticket-id { color: var(--danger); text-decoration: line-through; }

        .pay-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-efectivo { background: #dcfce7; color: #166534; }
        .badge-digital { background: #e0e7ff; color: #1e40af; }
        .badge-anulado { background: var(--danger); color: white; }

        .card-body { padding: 16px; }
        .info-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
        .info-icon { background: var(--p-interactive-light); color: var(--p-interactive); padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center;}
        .sale-card.anulada .info-icon { background: #fca5a5; color: #7f1d1d; }

        .info-data { width: 100%; }
        .info-data strong { display: block; font-size: 13px; color: var(--p-action-primary); margin-bottom: 2px;}
        .info-data small { color: var(--p-text-subdued); font-size: 11px; }

        .product-list { margin-top: 6px; padding-top: 6px; border-top: 1px solid #f1f5f9; color: #475569; font-size: 11px; line-height: 1.5; }

        .financial-block { background: var(--ticket-bg); border-radius: 6px; padding: 12px; margin-top: 15px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 6px;}
        .sale-card.anulada .financial-block { background: #fef2f2; border-color: #fca5a5; }

        .fin-detail { display: flex; justify-content: space-between; font-size: 11px; color: var(--p-text-subdued); }
        .fin-detail span:last-child { font-family: monospace; font-weight: 600; color: var(--p-text); font-size: 12px;}
        
        .fin-total { display: flex; justify-content: space-between; align-items: center; border-top: 2px dashed #cbd5e1; padding-top: 10px; margin-top: 4px;}
        .fin-total span:first-child { font-weight: 800; color: var(--p-action-primary); font-size: 12px; }
        .fin-total span:last-child { font-weight: 800; color: #15803d; font-size: 16px; }
        .sale-card.anulada .fin-total span { color: var(--danger); text-decoration: line-through; }

        /* ACCIONES */
        .card-actions { display: flex; border-top: 1px solid #e2e8f0; background: var(--p-surface);}
        .sale-card.anulada .card-actions { background: #fef2f2; border-color: #fca5a5; }

        .btn-action { flex: 1; padding: 12px 4px; background: none; border: none; border-right: 1px solid #e2e8f0; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 4px; color: var(--p-text); font-size: 12px;}
        .btn-action:last-child { border-right: none; }
        .btn-action.delete { color: var(--danger); }
        .btn-action:hover { background: #f8fafc; }
        .btn-action:disabled { color: #94a3b8; cursor: not-allowed; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--p-text-subdued); background: white; border: 2px dashed #cbd5e1; border-radius: 8px;}

        /* ==========================================
           SISTEMA DE MODALES Y ALERTAS PRO
           ========================================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(32, 34, 35, 0.8);
            display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; animation: fadeIn 0.2s forwards;
        }
        .modal-content {
            background: var(--p-surface); width: 90%; max-width: 400px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden; transform: scale(0.95); animation: scaleUp 0.2s forwards;
        }
        .modal-header { padding: 16px 20px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--p-border); }
        .modal-body { padding: 20px; color: var(--p-text); font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
        .modal-footer { padding: 16px 20px; background: #fafbfb; border-top: 1px solid var(--p-border); display: flex; justify-content: space-between; gap: 10px;}
        
        .modal-header.error { color: var(--p-critical); }
        .modal-header.warning { color: var(--warning); }
        
        .polaris-btn-primary {
            background-color: var(--p-action-primary); color: white; border: 1px solid transparent; padding: 8px 16px;
            border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,0.05); transition: background 0.2s;
        }
        .polaris-btn-primary:hover { background-color: #0f172a; }

        .polaris-btn-secondary {
            background-color: var(--p-surface); color: var(--p-text); border: 1px solid var(--p-border); padding: 8px 16px;
            border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .polaris-btn-secondary:hover { background: #f4f6f8; }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes scaleUp { to { transform: scale(1); } }

        /* Toast Notification */
        .polaris-toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 20px; border-radius: 6px; font-size: 14px; display: none; z-index: 1000; align-items: center; gap: 8px;}
    </style>

</head>
<body>

    <div class="top-fixed-section">
        <header class="polaris-header">
            <div></div>
            <h1>HISTORIAL DE VENTAS</h1>
            <div style="display: flex; justify-content: flex-end;">
                <span class="material-icons-outlined icon-btn" onclick="window.location.href='Control.html'" title="Volver al Panel">dashboard</span>
            </div>
        </header>

        <div class="system-info">
            <span id="txt-fecha">Generado: --/--/----</span>
            <span>Ventas Válidas: <strong id="txt-count" style="color: var(--p-action-primary);">0</strong></span>
        </div>

        <div class="dashboard-container">
            <div class="kpi-card">
                <h3>Ingresos Recaudados</h3>
                <div class="value" id="kpi-total-ingresos">S/ 0.00</div>
            </div>

            <div class="search-box">
                <div class="search-header">
                    <span class="material-icons-outlined" style="color: var(--p-interactive); font-size: 16px;">manage_search</span> 
                    Filtros de Búsqueda
                </div>
                
                <div class="search-grid">
                    <div class="polaris-field">
                        <label class="polaris-label">Fecha</label>
                        <input type="date" id="filtro-fecha" class="polaris-input" onchange="aplicarFiltros()">
                    </div>
                    <div class="polaris-field">
                        <label class="polaris-label">N° Boleta</label>
                        <input type="text" id="filtro-boleta" class="polaris-input" placeholder="Ej. 000001" onkeyup="aplicarFiltros()">
                    </div>
                    <div class="polaris-field full-width">
                        <label class="polaris-label">Cliente (Nombre o DNI)</label>
                        <input type="text" id="filtro-cliente" class="polaris-input" placeholder="Buscar por DNI o Nombre..." onkeyup="aplicarFiltros()">
                    </div>
                </div>
                <button type="button" class="btn-limpiar" onclick="limpiarFiltros()">
                    <span class="material-icons-outlined" style="font-size: 14px;">filter_alt_off</span> Limpiar Filtros
                </button>
            </div>
        </div>
    </div>

    <div class="scrollable-list">
        <div class="sales-list" id="ventas-container">
            </div>
    </div>

    <div id="modal-alerta" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header warning" id="alerta-header">
                <span class="material-icons-outlined" id="alerta-icon">warning</span>
                <h3 id="alerta-titulo">Atención</h3>
            </div>
            <div class="modal-body" id="alerta-mensaje">Mensaje aquí.</div>
            <div class="modal-footer" style="justify-content: center;">
                <button class="polaris-btn-primary" onclick="cerrarAlerta()" style="width: 100%;">Entendido</button>
            </div>
        </div>
    </div>

    <div id="modal-confirm" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header error">
                <span class="material-icons-outlined">block</span>
                <h3>Anular Boleta</h3>
            </div>
            <div class="modal-body" id="confirm-mensaje">¿Estás seguro de que deseas anular esta boleta?</div>
            <div class="modal-footer">
                <button class="polaris-btn-secondary" onclick="cerrarConfirmacion()">Cancelar</button>
                <button class="polaris-btn-primary" style="background:var(--p-critical);" id="btn-confirm-action">Sí, Anular</button>
            </div>
        </div>
    </div>

    <div id="toast" class="polaris-toast">
        <span class="material-icons-outlined" style="font-size: 18px; color: #4ade80;" id="toast-icon">check_circle</span>
        <span id="toast-msg">Operación exitosa</span>
    </div>

<script src="ticket.js"></script>

<script>
    // ==========================================
    // SISTEMA VISUAL DE ALERTAS PRO
    // ==========================================
    function mostrarAlerta(titulo, mensaje, tipo = 'warning') {
        const modal = document.getElementById('modal-alerta');
        const header = document.getElementById('alerta-header');
        const icon = document.getElementById('alerta-icon');
        
        document.getElementById('alerta-titulo').innerText = titulo;
        document.getElementById('alerta-mensaje').innerText = mensaje;

        header.className = 'modal-header'; 
        if (tipo === 'warning') {
            header.classList.add('warning'); icon.innerText = 'warning';
        } else if (tipo === 'error') {
            header.classList.add('error'); icon.innerText = 'error';
        }

        modal.style.display = 'flex';
    }

    function cerrarAlerta() {
        document.getElementById('modal-alerta').style.display = 'none';
    }

    let confirmCallback = null;
    function mostrarConfirmacion(mensaje, callback) {
        document.getElementById('confirm-mensaje').innerText = mensaje;
        confirmCallback = callback;
        document.getElementById('modal-confirm').style.display = 'flex';
    }

    function cerrarConfirmacion() {
        document.getElementById('modal-confirm').style.display = 'none';
        confirmCallback = null;
    }

    document.getElementById('btn-confirm-action').addEventListener('click', () => {
        if (confirmCallback) confirmCallback();
        cerrarConfirmacion();
    });

    const formatoSoles = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' });

    function obtenerVentas() {
        return JSON.parse(localStorage.getItem('isa_ventas_db')) || [];
    }

    function mostrarToast(mensaje, esError = false) {
        const toast = document.getElementById('toast');
        const icon = document.getElementById('toast-icon');
        
        document.getElementById('toast-msg').innerText = mensaje;
        if(esError) {
            icon.innerText = "warning"; icon.style.color = "#f87171";
        } else {
            icon.innerText = "check_circle"; icon.style.color = "#4ade80";
        }
        toast.style.display = 'flex';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    // ==========================================
    // RENDERIZADO DE LA INTERFAZ (CON FALLBACKS Y % DINÁMICO)
    // ==========================================
    function renderizarVentas(datos) {
        const contenedor = document.getElementById('ventas-container');
        contenedor.innerHTML = '';
        
        // Obtener IGV actual configurado para la etiqueta visual
        const configGuardada = JSON.parse(localStorage.getItem('isa_config')) || {};
        const igvConfigurado = configGuardada.igv !== undefined ? configGuardada.igv : 18;

        let totalRecaudado = 0;
        let ventasValidasCount = 0; 

        if(datos.length === 0) {
            contenedor.innerHTML = `<div class="empty-state"><span class="material-icons-outlined" style="font-size: 32px; color: #cbd5e1; margin-bottom: 10px;">receipt_long</span><p>No se encontraron resultados.</p></div>`;
            document.getElementById('kpi-total-ingresos').innerText = formatoSoles.format(0);
            document.getElementById('txt-count').innerText = 0;
            return;
        }

        datos.forEach(item => {
            if (!item.anulado) { 
                totalRecaudado += parseFloat(item.total) || 0; 
                ventasValidasCount++;
            }

            const card = document.createElement('div');
            card.className = `sale-card ${item.anulado ? 'anulada' : ''}`;
            
            let tipoPago = item.tipoPago || 'Efectivo';
            let claseBadge = (tipoPago === 'Efectivo') ? 'badge-efectivo' : 'badge-digital';
            if(item.anulado) { tipoPago = "ANULADA"; claseBadge = "badge-anulado"; }

            // SAFE FALLBACK: Evitar error "split is not a function" si el nombre es undefined
            let nomVendedor = "No Registrado";
            if (item.nombreVendedor) {
                nomVendedor = item.nombreVendedor.split(' ')[0];
            } else if (item.idVendedor) {
                nomVendedor = item.idVendedor;
            }

            // SAFE FALLBACK: Evitar error si "productos" no existe o no es un arreglo
            let resumenProductos = "";
            if(item.productos && Array.isArray(item.productos) && item.productos.length > 0) {
                const nombres = item.productos.map(p => `• ${p.cantidad}x ${p.nombre || 'Desconocido'}`).join('<br>');
                resumenProductos = `<div class="product-list">${nombres}</div>`;
            } else {
                resumenProductos = `<div class="product-list">• ${item.cantidad || 0}x ${item.nombreProd || 'Producto Desconocido'}</div>`;
            }

            let descuentoHtml = "";
            if(item.desc && parseFloat(item.desc) > 0) {
                descuentoHtml = `<div class="fin-detail" style="color: var(--danger);"><span>Descuento:</span> <span>-${formatoSoles.format(item.desc)}</span></div>`;
            }

            // Validar que exista la boleta
            const boletaSegura = item.boleta ? String(item.boleta).padStart(6, '0') : '000000';

            card.innerHTML = `
                <div class="card-header">
                    <div class="ticket-id"><span class="material-icons-outlined" style="font-size: 16px;">receipt</span> BOL-${boletaSegura}</div>
                    <div class="pay-badge ${claseBadge}">${tipoPago}</div>
                </div>
                
                <div class="card-body">
                    <div class="info-row">
                        <div class="info-icon"><span class="material-icons-outlined" style="font-size: 16px;">person</span></div>
                        <div class="info-data">
                            <strong>${item.nombreCliente || 'Cliente General'}</strong>
                            <small>DNI: ${item.dniCliente || 'S/D'} &nbsp;•&nbsp; ${item.fecha || '--/--/----'}</small>
                        </div>
                    </div>
                    
                    <div class="info-row" style="margin-bottom: 0;">
                        <div class="info-icon" style="background: transparent; color: #64748b; padding:0;"><span class="material-icons-outlined" style="font-size: 16px;">storefront</span></div>
                        <div class="info-data">
                            <strong>Cajero: ${nomVendedor}</strong>
                            ${resumenProductos}
                        </div>
                    </div>

                    <div class="financial-block">
                        <div class="fin-detail"><span>Subtotal:</span> <span>${formatoSoles.format(item.subtotal || 0)}</span></div>
                        ${descuentoHtml}
                        <div class="fin-detail"><span>IGV (${igvConfigurado}%):</span> <span>${formatoSoles.format(item.igv || 0)}</span></div>
                        <div class="fin-detail"><span>Bolsa Plástica:</span> <span>${formatoSoles.format(item.bolsa || 0)}</span></div>
                        <div class="fin-total"><span>TOTAL</span> <span>${formatoSoles.format(item.total || 0)}</span></div>
                    </div>
                </div>

                <div class="card-actions">
                    <button class="btn-action" style="color: var(--p-interactive);" onclick="llamarImpresion('${item.id}')">
                        <span class="material-icons-outlined" style="font-size: 14px;">print</span> Ticket
                    </button>
                    
                    <button class="btn-action delete" onclick="anularVenta('${item.id}', '${boletaSegura}')" ${item.anulado ? 'disabled' : ''}>
                        <span class="material-icons-outlined" style="font-size: 14px;">${item.anulado ? 'block' : 'cancel'}</span> Anular
                    </button>
                </div>
            `;
            contenedor.appendChild(card);
        });

        document.getElementById('kpi-total-ingresos').innerText = formatoSoles.format(totalRecaudado);
        document.getElementById('txt-count').innerText = ventasValidasCount;
    }

    // ==========================================
    // BÚSQUEDA OPTIMIZADA
    // ==========================================
    function aplicarFiltros() {
        let valFecha = document.getElementById('filtro-fecha').value; 
        const valBoleta = document.getElementById('filtro-boleta').value.toLowerCase().trim();
        const valCliente = document.getElementById('filtro-cliente').value.toLowerCase().trim();

        if(valFecha) {
            const parts = valFecha.split('-');
            valFecha = `${parts[2]}/${parts[1]}/${parts[0]}`; // Formatea YYYY-MM-DD a DD/MM/YYYY
        }

        let ventasDB = obtenerVentas();
        let datosFiltrados = ventasDB.filter(item => {
            const matchFecha = valFecha === "" || (item.fecha || "") === valFecha;
            // Safe string conversion to avoid errors on null/undefined
            const matchBoleta = (item.boleta || "").toString().toLowerCase().includes(valBoleta);
            
            // Busca en Nombre o DNI simultáneamente
            const strCliente = ((item.dniCliente || "") + " " + (item.nombreCliente || "")).toLowerCase();
            const matchCliente = valCliente === "" || strCliente.includes(valCliente);
            
            return matchFecha && matchBoleta && matchCliente;
        });

        // Ordenar siempre de la más reciente a la más antigua
        datosFiltrados.sort((a, b) => parseInt(b.boleta || 0) - parseInt(a.boleta || 0));
        renderizarVentas(datosFiltrados);
    }

    function limpiarFiltros() {
        document.getElementById('filtro-fecha').value = '';
        document.getElementById('filtro-boleta').value = '';
        document.getElementById('filtro-cliente').value = '';
        aplicarFiltros();
    }

    // ==========================================
    // ANULAR VENTA CON MODAL PRO
    // ==========================================
    function anularVenta(id, boletaTexto) {
        mostrarConfirmacion(
            `⚠️ ATENCIÓN: ¿Está seguro que desea ANULAR la boleta N° BOL-${boletaTexto}?\n\nEl registro dejará de sumar a los ingresos y el stock volverá al inventario.`,
            () => {
                let ventasDB = obtenerVentas();
                const index = ventasDB.findIndex(item => item.id === id);
                if (index !== -1) {
                    ventasDB[index].anulado = true;
                    localStorage.setItem('isa_ventas_db', JSON.stringify(ventasDB));
                    aplicarFiltros();
                    mostrarToast(`Boleta BOL-${boletaTexto} ha sido anulada.`, true);
                }
            }
        );
    }

    // ==========================================
    // IMPRESIÓN CENTRALIZADA A TICKET.JS
    // ==========================================
    function llamarImpresion(id) {
        const ventasDB = obtenerVentas();
        const venta = ventasDB.find(v => v.id === id);
        
        if(!venta) return mostrarAlerta("Error de Lectura", "No se pudo recuperar la información de este ticket en la base de datos.", "error");

        if (typeof imprimirTicketGlobal === 'function') {
            imprimirTicketGlobal(venta);
        } else {
            mostrarAlerta("Librería Faltante", "El módulo de impresión ('ticket.js') no está conectado correctamente.", "error");
        }
    }

    // ==========================================
    // INICIALIZACIÓN Y GUARDIÁN DE SESIÓN
    // ==========================================
    window.onload = () => {
        // --- INICIO DEL GUARDIÁN ---
        const sesionStr = localStorage.getItem('isa_sesion');
        
        // 1. Si no hay sesión, al Login
        if (!sesionStr) {
            window.location.href = 'index.html';
            return;
        }

        const sesion = JSON.parse(sesionStr);
        
        // 2. Control RBAC: Logística NO ve ventas
        if (sesion.rol === 'Logística') {
            alert('Acceso Denegado: Tu rol de Logística no tiene permisos para ver las ventas.');
            window.location.href = 'BDInventario.html'; // Lo enviamos a su área de trabajo
            return;
        }
        // --- FIN DEL GUARDIÁN ---

        // Si pasa la seguridad, cargamos la página
        const hoy = new Date();
        document.getElementById('txt-fecha').innerHTML = `Generado: <strong>${hoy.toLocaleDateString('es-PE')}</strong>`;
        
        // Cargar las ventas al inicio
        aplicarFiltros(); 
    };
</script>

</body>
</html>
